name: Deploy H5 to intranet server

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      target:
        description: "选择部署服务器"
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: work-dispatch-h5
  cancel-in-progress: false

jobs:
  build:
    name: Build H5
    runs-on: ubuntu-latest
    env:
      # AppKey is the public client identifier required by dd.requestAuthCode.
      # AppSecret must remain server-side and must never be added here.
      VITE_DINGTALK_CLIENT_ID: ding6klbziftyuowibuu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build root H5
        env:
          VITE_APP_BASE_URL: /api
        run: pnpm run build:h5

      - name: Collect root files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-root
          for dir in dist/build/h5 dist/build/web \
            unpackage/dist/build/web unpackage/dist/build/h5; do
            if [ -f "$dir/index.html" ]; then
              cp -a "$dir/." release-root/
              break
            fi
          done
          test -s release-root/index.html
          grep -qE '(src|href)="/assets/' release-root/index.html
          ! grep -qE '(src|href)="/work/assets/' release-root/index.html

      - name: Build work subpath H5
        env:
          VITE_APP_BASE_URL: /api
        run: pnpm run build:h5:work

      - name: Collect work subpath files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-work
          for dir in dist/build/h5 dist/build/web \
            unpackage/dist/build/web unpackage/dist/build/h5; do
            if [ -f "$dir/index.html" ]; then
              cp -a "$dir/." release-work/
              break
            fi
          done
          test -s release-work/index.html
          grep -qE '(src|href)="/work/assets/' release-work/index.html
          ! grep -qE '(src|href)="/assets/' release-work/index.html
          grep -RqsF "$VITE_DINGTALK_CLIENT_ID" release-work/assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-${{ github.run_id }}
          path: |
            release-root/
            release-work/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy from intranet runner
    needs: build
    runs-on: [self-hosted, windows, x64]
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || vars.DEFAULT_DEPLOY_ENV || 'webdock-vps' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: h5-${{ github.run_id }}
          path: release

      - name: Check deployment environment
        shell: powershell
        env:
          # 正式环境曾把外网访问地址写进 SSH 主机，但 Runner 与 known_hosts
          # 都使用内网服务器。保留环境变量优先级，同时兼容这份旧配置。
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST == '77.46.140.135' && '192.168.251.120' || vars.DEPLOY_HOST }}
          DEPLOY_HOST_FALLBACK: ${{ vars.DEPLOY_HOST == '77.46.140.135' && vars.DEPLOY_HOST || '' }}
          DEPLOY_HOST_KEY_ALIAS: ${{ vars.DEPLOY_HOST == '77.46.140.135' && '192.168.251.120' || '' }}
          DEPLOY_USER_FALLBACK: ${{ vars.DEPLOY_HOST == '77.46.140.135' && 'root' || '' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (vars.DEPLOY_HOST == '77.46.140.135' && '/var/www/myapp/dist/work' || '') }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)

          foreach ($name in 'DEPLOY_HOST', 'DEPLOY_USER', 'DEPLOY_PATH', 'DEPLOY_SSH_KEY', 'DEPLOY_KNOWN_HOSTS') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name 为空"
            }
          }

          if ($env:DEPLOY_PATH -notmatch '^/[A-Za-z0-9._/-]+$' -or $env:DEPLOY_PATH -eq '/') {
            throw "DEPLOY_PATH 非法: $($env:DEPLOY_PATH)"
          }

          $releaseName = if ($env:DEPLOY_PATH.TrimEnd('/') -match '/work$') { 'release-work' } else { 'release-root' }
          $releasePath = Join-Path 'release' $releaseName
          $indexPath = Join-Path $releasePath 'index.html'
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
            throw "构建产物缺少 $indexPath"
          }

          $indexHtml = Get-Content -LiteralPath $indexPath -Raw
          if ($releaseName -eq 'release-work' -and $indexHtml -notmatch '(src|href)="/work/assets/') {
            throw 'work 子路径构建未引用 /work/assets/'
          }
          if ($releaseName -eq 'release-root' -and $indexHtml -match '(src|href)="/work/assets/') {
            throw '根路径构建错误引用了 /work/assets/'
          }

          foreach ($command in 'tar.exe', 'scp.exe', 'ssh.exe') {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "内网 Runner 缺少命令: $command"
            }
          }

          $candidateHosts = @($env:DEPLOY_HOST)
          if (-not [string]::IsNullOrWhiteSpace($env:DEPLOY_HOST_FALLBACK) -and $env:DEPLOY_HOST_FALLBACK -ne $env:DEPLOY_HOST) {
            $candidateHosts += $env:DEPLOY_HOST_FALLBACK
          }

          $resolvedHost = $null
          foreach ($candidateHost in $candidateHosts) {
            $connection = Test-NetConnection -ComputerName $candidateHost -Port 22 -WarningAction SilentlyContinue
            if ($connection.TcpTestSucceeded) {
              $resolvedHost = $candidateHost
              break
            }
            Write-Warning "SSH endpoint unavailable: ${candidateHost}:22"
          }

          if ([string]::IsNullOrWhiteSpace($resolvedHost)) {
            throw "Runner 无法连接任一 SSH 地址: $($candidateHosts -join ', ')"
          }

          "DEPLOY_HOST=$resolvedHost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPLOY_HOST_KEY_ALIAS=$($env:DEPLOY_HOST_KEY_ALIAS)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DEPLOY_USER_FALLBACK=$($env:DEPLOY_USER_FALLBACK)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SSH connectivity check passed: ${resolvedHost}:22"

      - name: Upload and deploy
        shell: powershell
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || (vars.DEPLOY_HOST == '77.46.140.135' && '/var/www/myapp/dist/work' || '') }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)

          function Invoke-NativeCommand {
            param(
              [Parameter(Mandatory = $true)]
              [scriptblock] $Command,
              [Parameter(Mandatory = $true)]
              [string] $Description
            )

            & $Command
            if ($LASTEXITCODE -ne 0) {
              throw "$Description 失败，退出码: $LASTEXITCODE"
            }
          }

          $tempDirectory = Join-Path $env:RUNNER_TEMP "work-dispatch-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $keyPath = Join-Path $tempDirectory 'deploy_key'
          $knownHostsPath = Join-Path $tempDirectory 'known_hosts'
          $archiveName = "h5-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).tar.gz"
          $archivePath = Join-Path $tempDirectory $archiveName
          $scriptName = "deploy-h5-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).sh"
          $scriptPath = Join-Path $tempDirectory $scriptName
          $releaseName = if ($env:DEPLOY_PATH.TrimEnd('/') -match '/work$') { 'release-work' } else { 'release-root' }
          $releasePath = Join-Path 'release' $releaseName

          New-Item -ItemType Directory -Path $tempDirectory -Force | Out-Null

          try {
            $keyContent = $env:DEPLOY_SSH_KEY.Trim() -replace '\\r', '' -replace '\\n', "`n" -replace "`r", ''
            if (-not $keyContent.EndsWith("`n")) {
              $keyContent += "`n"
            }

            [IO.File]::WriteAllText($keyPath, $keyContent, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($knownHostsPath, ($env:DEPLOY_KNOWN_HOSTS -replace "`r", ''))

            $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            & icacls.exe $keyPath /inheritance:r | Out-Null
            if ($LASTEXITCODE -ne 0) { throw '设置 SSH 私钥 ACL 失败' }
            & icacls.exe $keyPath /grant:r "${currentUser}:(R)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw '授权 SSH 私钥读取权限失败' }

            $deployPublicKey = (& ssh-keygen.exe -y -f $keyPath 2>$null) -join ''
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($deployPublicKey)) {
              throw 'DEPLOY_SSH_KEY 无法派生公钥，请重新保存有效的 OpenSSH 私钥'
            }

            $remoteScript = @'
          set -euo pipefail

          archive="$1"
          deploy_path="${2%/}"
          base="$HOME/work-h5"
          version="v$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID:-manual}"
          directory="$base/releases/$version"
          backup="$base/backups/$version"
          has_backup=false

          cleanup() {
            rm -f "$HOME/$archive" "$0"
          }
          trap cleanup EXIT

          report_error() {
            local exit_code=$?
            echo "REMOTE_DEPLOY_ERROR line=$1 exit=$exit_code command=$2" >&2
            exit "$exit_code"
          }
          trap 'report_error "$LINENO" "$BASH_COMMAND"' ERR

          if [ -z "$deploy_path" ] || [ "$deploy_path" = / ]; then
            echo "Invalid deployment path: $deploy_path" >&2
            exit 1
          fi

          echo "Remote deployment user: $(id -un)"
          echo "Remote deployment path: $deploy_path"
          mkdir -p "$directory"
          tar -xzf "$HOME/$archive" -C "$directory"
          test -s "$directory/index.html"

          # 旧版本可能由 root 手工发布，导致 deploy 用户无法清理带哈希的资源文件。
          # 仅在目标目录存在不可写内容时修正归属，并要求服务器已配置免密 sudo。
          if [ -d "$deploy_path" ] && {
            [ ! -w "$deploy_path" ] ||
            find "$deploy_path" -mindepth 1 ! -writable -print -quit | grep -q .
          }; then
            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n true; then
              echo "Deployment path contains files not writable by $(id -un), and passwordless sudo is unavailable: $deploy_path" >&2
              exit 1
            fi
            echo "Repairing deployment ownership for $(id -un): $deploy_path"
            sudo -n chown -R "$(id -u):$(id -g)" "$deploy_path"
          fi

          clear_directory() {
            local target=$1
            find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          }

          restore_backup() {
            if [ "$has_backup" = true ]; then
              mkdir -p "$deploy_path"
              clear_directory "$deploy_path"
              cp -a "$backup/." "$deploy_path/"
            fi
          }

          if [ -d "$deploy_path" ]; then
            mkdir -p "$backup"
            cp -a "$deploy_path/." "$backup/"
            has_backup=true
          fi

          mkdir -p "$deploy_path"
          if ! clear_directory "$deploy_path"; then
            restore_backup
            exit 1
          fi
          if ! cp -a "$directory/." "$deploy_path/"; then
            restore_backup
            exit 1
          fi

          verify_release() {
            test -s "$deploy_path/index.html" || return 1
            while IFS= read -r asset; do
              relative="${asset#/}"
              if [[ "$relative" == work/* ]]; then
                relative="${relative#work/}"
              fi
              test -s "$deploy_path/$relative" || return 1
            done < <(grep -oE '(src|href)="/[^"]+\.(js|css)"' "$deploy_path/index.html" | sed -E 's/^(src|href)="([^"]+)"/\2/')
          }

          if ! verify_release; then
            restore_backup
            exit 1
          fi

          public_prefix=''
          if [[ "$deploy_path" == */work ]]; then
            public_prefix='/work'
          fi
          expected_entry=$(grep -oE "src=\"${public_prefix}/assets/index-[^\"]+\\.js\"" "$deploy_path/index.html" | head -n 1 || true)
          served_index=$(curl -fsS "http://127.0.0.1:8081${public_prefix}/?release=$version")
          actual_entry=$(printf '%s' "$served_index" | grep -oE "src=\"${public_prefix}/assets/index-[^\"]+\\.js\"" | head -n 1 || true)
          echo "Expected entry: $expected_entry"
          echo "Served entry:   $actual_entry"
          if [ -z "$expected_entry" ] || [ "$actual_entry" != "$expected_entry" ]; then
            echo "Nginx is not serving the deployed work directory: $deploy_path" >&2
            if command -v docker >/dev/null 2>&1; then
              docker ps --format 'Container={{.Names}} Ports={{.Ports}}'
              for container in $(docker ps --format '{{.Names}}'); do
                docker inspect --format 'Container={{.Name}}{{range .Mounts}}{{println}}{{.Source}} -> {{.Destination}}{{end}}' "$container"
              done
            fi
            exit 1
          fi

          echo "Deployed: $version -> $deploy_path"
          '@
            $remoteScript = $remoteScript -replace "`r`n", "`n"
            [IO.File]::WriteAllText($scriptPath, $remoteScript, [Text.UTF8Encoding]::new($false))

            Invoke-NativeCommand -Description '压缩部署产物' -Command {
              & tar.exe -czf $archivePath -C $releasePath .
            }

            $sshOptions = @(
              '-i', $keyPath,
              '-o', "UserKnownHostsFile=$knownHostsPath",
              '-o', 'StrictHostKeyChecking=yes',
              '-o', 'BatchMode=yes',
              '-o', 'ConnectTimeout=15'
            )
            if (-not [string]::IsNullOrWhiteSpace($env:DEPLOY_HOST_KEY_ALIAS)) {
              $sshOptions += @('-o', "HostKeyAlias=$($env:DEPLOY_HOST_KEY_ALIAS)")
            }

            $candidateUsers = @()
            if (-not [string]::IsNullOrWhiteSpace($env:DEPLOY_USER_FALLBACK) -and $env:DEPLOY_USER_FALLBACK -ne $env:DEPLOY_USER) {
              $candidateUsers += $env:DEPLOY_USER_FALLBACK
            }
            $candidateUsers += $env:DEPLOY_USER

            $remote = $null
            foreach ($candidateUser in $candidateUsers) {
              & ssh.exe @sshOptions "${candidateUser}@$($env:DEPLOY_HOST)" 'true'
              if ($LASTEXITCODE -eq 0) {
                $remote = "${candidateUser}@$($env:DEPLOY_HOST)"
                break
              }
              Write-Warning "SSH key authentication failed for user: $candidateUser"
            }
            if ([string]::IsNullOrWhiteSpace($remote)) {
              Write-Host "DEPLOY_PUBLIC_KEY=$deployPublicKey"
              throw "SSH 私钥未获任一部署用户授权: $($candidateUsers -join ', ')"
            }

            Invoke-NativeCommand -Description '上传部署产物' -Command {
              & scp.exe @sshOptions $archivePath $scriptPath "${remote}:~/"
            }

            Invoke-NativeCommand -Description '执行远程部署' -Command {
              & ssh.exe @sshOptions $remote "GITHUB_RUN_ID='$($env:GITHUB_RUN_ID)' bash ~/$scriptName '$archiveName' '$($env:DEPLOY_PATH)'"
            }

            Write-Host "Deployment completed: $remote"
          }
          finally {
            if (Test-Path -LiteralPath $tempDirectory) {
              [IO.Directory]::Delete($tempDirectory, $true)
            }
          }
