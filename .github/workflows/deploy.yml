# 报工 H5 部署：Ubuntu 构建 → 临时 Release 传包（不占 Artifact 配额）→ 内网 Windows Runner
# 逐台 SSH 发布并确认 Nginx 返回新版本 → 删除临时 Release。
# 服务器清单见 .github/deploy-targets.json；默认部署的服务器由仓库变量 DEPLOY_TARGETS 设置。
name: 报工 H5 部署

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 部署服务器（default = 默认服务器，未设置仓库变量 DEPLOY_TARGETS 时为生产 server-120；server-150 为测试）
        required: true
        default: default
        type: choice
        options: [default, server-120, server-150, myvps, all]
      check_only:
        description: 只测试 SSH 连通性，不构建不部署
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: h5-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: work-dispatch-h5.tar.gz
  RELEASE_TAG: ci-h5-${{ github.run_id }}
  CHECK_ONLY: ${{ inputs.check_only == true }}

jobs:
  build:
    name: 构建 H5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    env:
      # AppKey 是 dd.requestAuthCode 需要的公开客户端标识；AppSecret 只在服务端，不能写在这里。
      VITE_DINGTALK_CLIENT_ID: ding6klbziftyuowibuu
      VITE_APP_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 选择部署服务器
        id: targets
        env:
          REQUESTED: ${{ inputs.target }}
          DEFAULT_TARGETS: ${{ vars.DEPLOY_TARGETS }}
        run: bash scripts/ci/select-targets.sh

      - name: 安装 pnpm
        if: env.CHECK_ONLY != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        if: env.CHECK_ONLY != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        if: env.CHECK_ONLY != 'true'
        run: pnpm install --frozen-lockfile

      - name: 构建根路径和 /work 子路径两个版本
        if: env.CHECK_ONLY != 'true'
        run: |
          set -euo pipefail
          collect() {
            for dir in dist/build/h5 dist/build/web unpackage/dist/build/web unpackage/dist/build/h5; do
              if [[ -f "$dir/index.html" ]]; then mkdir -p "$1"; cp -a "$dir/." "$1/"; return; fi
            done
            echo "::error::找不到构建产物 index.html"; exit 1
          }
          pnpm run build:h5
          collect package/site-root
          grep -qE '(src|href)="/assets/' package/site-root/index.html

          pnpm run build:h5:work
          collect package/site-work
          grep -qE '(src|href)="/work/assets/' package/site-work/index.html
          grep -RqsF "$VITE_DINGTALK_CLIENT_ID" package/site-work/assets

          sed 's/\r$//' scripts/ci/deploy-h5.sh > package/deploy-h5.sh
          tar -czf "$PACKAGE" -C package .

      - name: 上传部署包到临时 Release
        if: env.CHECK_ONLY != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "$RELEASE_TAG" --notes '临时部署包，部署结束后自动删除。'

  deploy:
    name: 部署 ${{ matrix.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    environment:
      name: ${{ matrix.name }}
    concurrency:
      group: h5-deploy-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: SSH 发布
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          # ---- 服务器连接（三个仓库相同）：地址在 deploy-targets.json，密钥在 Secret ----
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_PORT: ${{ matrix.port || vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ matrix.user || vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          DEPLOY_AUTH: ${{ matrix.auth || 'key' }}
          # DEPLOY_SSH_KEY 是旧名称，过渡期间兼容。
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY || secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST_KEY: ${{ matrix.hostKey }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_FP: ${{ vars.DEPLOY_FP }}
          # ---- 本仓库的部署参数 ----
          SITE_DIR: ${{ matrix.dir || vars.DEPLOY_PATH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CHECK_ONLY -eq 'true') {
            & .\scripts\ci\deploy.ps1 -CheckOnly
          }
          else {
            if ($env:SITE_DIR -notmatch '^/[A-Za-z0-9._/-]+$' -or $env:SITE_DIR -eq '/') {
              throw "没有发布目录：请在 deploy-targets.json 给 $env:DEPLOY_HOST 写 dir，或在 Environment 设置变量 DEPLOY_PATH"
            }
            & .\scripts\ci\deploy.ps1 -ReleaseTag $env:RELEASE_TAG -AssetName $env:PACKAGE -Entry deploy-h5.sh -Arguments @($env:SITE_DIR)
          }

  # 部署成功才删除临时 Release；失败时保留，方便直接“Re-run failed jobs”，
  # 遗留的临时 Release 由每天的 ci-cleanup 工作流在一天后删除。
  cleanup:
    name: 删除临时 Release
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'success' && inputs.check_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 删除本次运行的临时 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || echo '没有需要删除的临时 Release'
